# Render does not sync this file; live config is set in the dashboard. Matched to live 2026-10-17,
# except the web startCommand: live runs `streamlit run app.py` directly.
services:
  - type: web
    name: tracksidelabs
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash scripts/start_render.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.14"
      - key: USE_DB_STORAGE
        value: dual_write
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TL_ADMIN_TOKEN
        sync: false
      # Let the operator panel trigger a precompute run and restart this service.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_PRECOMPUTE_CRON_ID
        sync: false
      - key: RENDER_WEB_SERVICE_ID
        sync: false
    autoDeploy: true
  - type: cron
    name: trackside-labs-warmup
    env: python
    plan: starter
    # Hourly at minute 5, Friday to Sunday UTC.
    schedule: "5 * * * 5,6,0"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/warmup_precompute.py --year 2026 --require-db"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.14"
      - key: USE_DB_STORAGE
        value: dual_write
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    autoDeploy: true
